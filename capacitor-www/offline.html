<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sarawak Trip Planner</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        background: linear-gradient(160deg, #2a1259 0%, #4a1d96 55%, #86198f 100%);
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        text-wrap: balance;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sarawak Trip Planner can't open</h1>
      <p>
        Check your internet connection, and make sure “Android System WebView”
        is up to date in Google Play. Then close and reopen the app. Your trips
        and bookings are safe.
      </p>
    </main>
  </body>
</html>
